name: q82 symbolic probe

on:
  push:
    branches: ["research/symbolic-q82"]
    paths:
      - "research/**"
      - ".github/workflows/q82-symbolic-probe.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "research/**"
      - ".github/workflows/q82-symbolic-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check combinatorial excess theorem
        run: |
          python3 research/q82_excess_check.py
      - name: Run exact symbolic probe
        run: |
          python3 research/q82_symbolic_probe.py
      - name: Install numerical tools
        run: |
          python3 -m pip install --quiet numpy scipy
      - name: Inspect N00 spectrum
        run: |
          python3 research/q82_n00_spectrum.py
      - name: Compare exact dual congruences
        run: |
          python3 research/q82_n00_congruence.py
