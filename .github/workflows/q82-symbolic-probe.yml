name: q82 symbolic probe

on:
  push:
    branches: ["research/symbolic-q82"]
    paths:
      - "research/**"
      - ".github/workflows/q82-symbolic-probe.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "research/**"
      - ".github/workflows/q82-symbolic-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run exact symbolic probe
        run: |
          python3 research/q82_symbolic_probe.py
      - name: Install numerical LP tools
        run: |
          python3 -m pip install --quiet numpy scipy
      - name: Inspect congruence-normalized N00 spectrum
        run: |
          python3 research/q82_n00_spectrum.py
      - name: Search sparse dual supports
        run: |
          python3 research/q82_sparse_dual.py
      - name: Test exact transfer of sparse rays
        run: |
          python3 research/q82_transfer_ray.py
